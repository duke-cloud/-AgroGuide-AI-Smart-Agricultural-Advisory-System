{% extends 'base.html' %}
{% block auth_content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a3a2a,#2d6a4f)">
  <div style="background:#fff;border-radius:20px;padding:40px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3)">
    <div style="text-align:center;margin-bottom:28px">
      <div style="font-size:48px">🌾</div>
      <div style="font-size:22px;font-weight:700;color:#1a3a2a">AgroGuide AI</div>
      <div style="font-size:12px;color:#888;letter-spacing:1px">SMART FARM AGENT</div>
    </div>
    {% if form.errors %}
    <div class="alert alert-danger">Invalid username or password.</div>
    {% endif %}
    <form method="post">{% csrf_token %}
      <div class="form-group">
        <label class="form-label">Username</label>
        <input name="username" class="form-control" placeholder="Enter username" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input name="password" type="password" class="form-control" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px">
        🚜 Sign In to Farm Portal
      </button>
    </form>
    <div style="text-align:center;margin-top:18px;font-size:13px;color:#888">
      New farmer? <a href="{% url 'register' %}" style="color:var(--primary);font-weight:600">Register here</a>
    </div>
  </div>
</div>
{% endblock %}
